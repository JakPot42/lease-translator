<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ title }}</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f8f9fa; color: #212529; min-height: 100vh; }
  a { color: #0066cc; text-decoration: none; }
  a:hover { text-decoration: underline; }

  .topbar { background: #1a1a2e; color: #e8e8f0; padding: 12px 24px; display: flex; align-items: center; gap: 12px; }
  .topbar-title { font-size: 1.1rem; font-weight: 700; color: #ffffff; }
  .topbar-subtitle { font-size: 0.8rem; color: #9999bb; }
  .topbar-nav { margin-left: auto; font-size: 0.85rem; }
  .topbar-nav a { color: #9999bb; margin-left: 16px; }
  .topbar-nav a:hover { color: #ffffff; text-decoration: none; }

  .demo-banner { background: #fff3cd; border-bottom: 2px solid #f0ad4e; padding: 8px 24px; font-size: 0.85rem; color: #856404; text-align: center; }

  .container { max-width: 900px; margin: 0 auto; padding: 32px 24px; }

  .card { background: #ffffff; border: 1px solid #dee2e6; border-radius: 8px; padding: 24px; margin-bottom: 20px; }
  .card-title { font-size: 1.1rem; font-weight: 700; color: #1a1a2e; margin-bottom: 12px; }

  .badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }
  .badge-pass { background: #d1e7dd; color: #0a3622; }
  .badge-fail { background: #f8d7da; color: #58151c; }

  .btn { display: inline-block; padding: 10px 20px; border-radius: 6px; font-size: 0.9rem; font-weight: 600; cursor: pointer; border: none; text-align: center; }
  .btn-primary { background: #1a1a2e; color: #ffffff; }
  .btn-primary:hover { background: #2d2d4e; color: #ffffff; text-decoration: none; }
  .btn-secondary { background: #e9ecef; color: #212529; }
  .btn-secondary:hover { background: #dee2e6; color: #212529; text-decoration: none; }
  .btn-danger { background: #dc3545; color: #ffffff; }
  .btn-sm { padding: 6px 14px; font-size: 0.82rem; }

  .form-control { width: 100%; padding: 10px 12px; border: 1px solid #ced4da; border-radius: 6px; font-size: 0.9rem; font-family: inherit; }
  textarea.form-control { resize: vertical; min-height: 200px; font-family: "Courier New", monospace; font-size: 0.85rem; }

  .alert { padding: 12px 16px; border-radius: 6px; margin-bottom: 16px; font-size: 0.9rem; }
  .alert-danger { background: #f8d7da; border: 1px solid #f5c2c7; color: #58151c; }
  .alert-success { background: #d1e7dd; border: 1px solid #badbcc; color: #0a3622; }
  .alert-warning { background: #fff3cd; border: 1px solid #ffecb5; color: #664d03; }

  table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid #dee2e6; }
  th { background: #f8f9fa; font-weight: 600; color: #495057; }

  .conflict-box { background: #fff5f5; border: 2px solid #dc3545; border-radius: 8px; padding: 16px; margin-bottom: 12px; }
  .conflict-clauses { font-weight: 700; color: #dc3545; margin-bottom: 6px; font-size: 0.88rem; }
  .conflict-explanation { color: #212529; line-height: 1.6; }

  .clause-card { padding: 12px 0; border-bottom: 1px solid #f0f0f0; }
  .clause-card:last-child { border-bottom: none; }
  .clause-name { font-weight: 700; color: #1a1a2e; font-size: 0.9rem; }
  .clause-text { color: #495057; font-size: 0.88rem; line-height: 1.6; margin-top: 4px; }

  .status-pass { color: #0a3622; font-weight: 700; }
  .status-fail { color: #58151c; font-weight: 700; }

  .disclaimer { font-size: 0.8rem; color: #6c757d; padding-top: 16px; border-top: 1px solid #dee2e6; margin-top: 16px; line-height: 1.5; }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 600px) { .grid-2 { grid-template-columns: 1fr; } }

  .text-muted { color: #6c757d; font-size: 0.85rem; }
  .mt-2 { margin-top: 8px; }
  .mt-3 { margin-top: 16px; }
  .mt-4 { margin-top: 24px; }
  .mb-1 { margin-bottom: 4px; }
</style>
</head>
<body>
<div class="topbar">
  <div>
    <div class="topbar-title">⚖ Lease Translator</div>
    <div class="topbar-subtitle">Plain-English Lease Contradiction Detector</div>
  </div>
  <nav class="topbar-nav">
    <a href="/">Home</a>
    <a href="/api/stats">Stats</a>
  </nav>
</div>

{% if demo_mode is defined and demo_mode %}
<div class="demo-banner">
  DEMO MODE — Claude extraction uses pre-baked demo data. Set <code>DEMO_MODE=False</code> with a real API key to analyze your own lease.
</div>
{% endif %}

<div class="container">
{% block content %}{% endblock %}
</div>
</body>
</html>
